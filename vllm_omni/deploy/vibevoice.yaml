# VibeVoice deploy: single-stage AR TTS with in-loop CFG diffusion and
# stateful acoustic/semantic feedback.
#
# Unlike codec-based TTS pipelines, VibeVoice cannot split waveform decoding
# into a second Code2Wav stage: every generated audio token is diffused,
# decoded to waveform, semantically re-encoded, and fed back to the next Qwen2
# decode step. The model therefore owns all per-request side state in stage 0.
#
# The Microsoft 1.5B checkpoint defaults to one GPU. Tensor parallelism adds
# collective communication while duplicating the side modules, so it is kept
# as an opt-in capability topology in vibevoice_tp2.yaml instead of the
# latency/throughput baseline. Diffusion and convolutional side-path
# allocations are outside vLLM's paged-KV accounting, so both KV pools use
# fixed budgets instead of consuming all memory allowed by
# gpu_memory_utilization.
async_chunk: false
trust_remote_code: false
# When --tokenizer is omitted, Omni reads
# preprocessor_config.json.language_model_pretrained_name. Offline deployments
# must pre-cache that tokenizer or pass a local --tokenizer path.
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: true

stages:
  - stage_id: 0
    devices: "0"
    # Fixed safe concurrency: four complete positive and negative sequences
    # must remain resident, so KV-pressure preemption is unreachable. At TP=1,
    # each pool needs 4 x 65,536 tokens x 28 KiB/token = 7 GiB. The 8 GiB
    # budgets below leave block-alignment headroom; startup guards re-verify
    # both pools from the actual attention layout.
    tensor_parallel_size: 1
    max_num_seqs: 4
    gpu_memory_utilization: 0.9
    # The processor/MM infrastructure reserves capacity for up to eight
    # ordered audio items. This is not the speaker limit: serving accepts at
    # most four speakers, with exactly one reference audio per speaker. At 60
    # seconds each, the MM ceiling is 8 * 450 = 3600 placeholder tokens, plus
    # text. Both the 65,536-token model limit and the 8,192-token per-iteration
    # chunked-prefill
    # budget can admit that worst-case reference prefill.
    limit_mm_per_prompt:
      audio: 8

    # The 1.5B Qwen2 backbone has only two KV heads. Eight GiB is sufficient
    # for four complete 64k positive sequences on one GPU while leaving ample
    # H100 VRAM for the negative CFG branch and the acoustic/semantic modules.
    kv_cache_memory_bytes: 8589934592  # 8 GiB
    engine_extras:
      additional_config:
        vibevoice_runtime_config:
          negative_kv_cache_memory_bytes: 8589934592  # 8 GiB
          negative_kv_activation_margin_bytes: 536870912  # 512 MiB

    # The official backbone supports 64k positions and generation_config.json
    # defaults to 40,500 new tokens. Chunked prefill bounds each scheduler
    # iteration without reducing the accepted prompt/context length.
    max_model_len: 65536
    max_num_batched_tokens: 8192

    # Phase C3: the positive Qwen forward is now graph-capturable (audio-token
    # transition work moved to preprocess_finalize). The negative branch and
    # diffusion/M4a stay eager outside the capture region. FULL decode graphs
    # eliminate per-layer FA3 metadata build + launch overhead.
    enforce_eager: false
    async_scheduling: true
    # The pinned v1 profiler first runs the dummy placeholder text without MM
    # data, which intentionally trips VibeVoice's symmetric placeholder check.
    # KV memory is fixed above and Processor limits are contract-tested, so
    # skip that incompatible generic profiling pass.
    skip_mm_profiling: true

    default_sampling_params:
      # VibeVoice's token gate is deterministic: the model constrains logits
      # to audio BOS/audio/audio EOS/EOS and selects with argmax.
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      repetition_penalty: 1.0
      seed: 42
      max_tokens: 40500
      extra_args:
        # Match the official Transformers generation_config.json.
        guidance_scale: 1.3
        num_diffusion_steps: 10
