# Optional VibeVoice TP=2 capability topology.
#
# The default vibevoice.yaml is the single-GPU performance/deployment baseline
# for the 1.5B checkpoint. Use this overlay only to validate tensor-parallel
# weight sharding, collectives, Named KV, CUDA graphs, and waveform parity.
# TP=2 is not the default benchmark because communication overhead can increase
# latency for this small backbone.

base_config: vibevoice.yaml

stages:
  - stage_id: 0
    devices: "0,1"
    tensor_parallel_size: 2
    # TP=2 shards the two KV heads. Four complete 64k requests require 3.5 GiB
    # per rank in each branch; retain the previously validated per-rank pools.
    kv_cache_memory_bytes: 6442450944  # 6 GiB
    engine_extras:
      additional_config:
        vibevoice_runtime_config:
          negative_kv_cache_memory_bytes: 4294967296  # 4 GiB
